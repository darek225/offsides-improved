name: Build FOSS APK (manual)
on:
  workflow_dispatch:
jobs:
  build-foss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Build FOSS release APK (no Firebase plugins)
        env:
          EXPO_PUBLIC_FOSS: '1'
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PexcludeFirebase --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offsides-plus-foss-apk
          path: android/app/build/outputs/apk/release/app-release.apk
