name: Build FOSS APK (manual)
on:
  workflow_dispatch:
jobs:
  build-foss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm ci
      - name: Exclude Firebase modules from autolinking (FOSS only, CI-local edit)
        run: node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.expo={...(p.expo||{}),autolinking:{exclude:['@react-native-firebase/app','@react-native-firebase/crashlytics','expo-dev-client','expo-dev-launcher','expo-dev-menu']}};fs.writeFileSync('package.json',JSON.stringify(p,null,2))"
      - name: Build FOSS release APK (no Firebase plugins)
        env:
          EXPO_PUBLIC_FOSS: '1'
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PexcludeFirebase --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: offsides-plus-foss-apk
          path: android/app/build/outputs/apk/release/app-release.apk
